<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Collaborative project management tool"><title>TaskFlow — Project Management</title><link rel="stylesheet" href="styles.css"></head>
<body>
<aside class="sidebar"><a class="logo" href="#" id="homeBtn"><span class="logo-icon">T</span><span class="logo-text">TaskFlow</span></a><p class="nav-label">WORKSPACE</p><button class="side-link active" id="projectsNav">▦ <span>My projects</span></button><button class="side-link" id="notificationsNav">♧ <span>Notifications</span><i id="notificationDot" hidden></i></button><div class="userbar"><div class="avatar" id="avatar">G</div><div class="usertext"><b id="userName">Guest</b><small id="userEmail">Sign in to start</small></div><button id="logoutBtn" hidden title="Log out">↗</button></div></aside>
<main class="main"><header class="topbar"><div><small>Workspace /</small> <b id="pageTitle">My projects</b></div><div class="top-actions"><button class="btn outline" id="authBtn">Login / Register</button><button class="btn primary" id="newProjectBtn">＋ New project</button></div></header>
<section class="hero"><div><p class="eyebrow">TEAM WORKSPACE</p><h1>Make great work <span>happen.</span></h1><p>Plan projects, organise tasks, and keep your team in sync.</p></div><div class="hero-art">✦</div></section>
<section class="content"><div class="section-head"><div><h2 id="sectionTitle">Your projects</h2><p id="sectionText">Everything your team is working on, in one place.</p></div><span id="countBadge">0 projects</span></div><div class="project-grid" id="projectGrid"></div></section><section id="detail" class="detail" hidden></section></main>
<div class="backdrop" id="backdrop" hidden><div class="modal"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div><div class="toast" id="toast"></div><script src="app.js"></script></body></html>
